<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scales of Measurement — PSYC1106</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;500;600;700&display=swap');
  :root {
    --navy:#0d2137; --navy-mid:#163352; --navy-light:#e8edf2;
    --gold:#E8A000; --gold-light:#fff8e6;
    --green:#1a7a4a; --green-light:#e6f4ed;
    --red:#c0392b; --red-light:#fdecea;
    --purple:#5b3ea8; --purple-light:#eeebf8;
    --text:#1a1a1a; --muted:#5a6a7a; --border:#dde3ea; --bg:#f4f6f8; --surface:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Sans 3',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 60px;display:flex;flex-direction:column;align-items:center;}
  .top-bar{width:100%;background:var(--navy);padding:18px 32px;display:flex;align-items:center;gap:14px;margin-bottom:32px;}
  .top-bar .icon{width:38px;height:38px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .top-bar .course-tag{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:2px;}
  .top-bar h1{font-family:'Source Serif 4',serif;font-size:1.3rem;font-weight:600;color:#fff;line-height:1.2;}
  .progress-wrap{width:100%;max-width:740px;padding:0 16px;margin-bottom:20px;}
  .progress-meta{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--muted);margin-bottom:7px;font-weight:600;}
  .progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);border-radius:3px;transition:width 0.5s ease;}
  .card{width:100%;max-width:740px;padding:0 16px;margin-bottom:16px;}
  .card-inner{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .card-header{padding:22px 26px 18px;border-bottom:1px solid var(--border);}
  .q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .q-num{background:var(--navy);color:#fff;font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;}
  .q-context{font-size:0.72rem;color:var(--muted);font-weight:600;background:var(--navy-light);padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
  .q-text{font-size:0.97rem;color:var(--text);line-height:1.65;margin-bottom:14px;}
  .q-ask{font-size:0.85rem;font-weight:700;color:var(--navy);background:var(--gold-light);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 6px 6px 0;}
  .options{padding:18px 26px 22px;display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.15s;color:var(--text);font-family:'Source Sans 3',Arial,sans-serif;font-size:0.9rem;line-height:1.45;text-align:left;}
  .opt:hover:not([disabled]){border-color:var(--navy);background:var(--navy-light);}
  .opt[disabled]{cursor:default;}
  .opt.correct{border-color:var(--green);background:var(--green-light);color:var(--green);}
  .opt.wrong{border-color:var(--red);background:var(--red-light);color:var(--red);opacity:0.8;}
  .opt.missed{border-color:var(--green);background:var(--green-light);color:var(--green);opacity:0.65;}
  .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--navy-light);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;margin-top:1px;}
  .opt.correct .opt-letter,.opt.missed .opt-letter{background:var(--green);color:#fff;}
  .opt.wrong .opt-letter{background:var(--red);color:#fff;}
  .feedback{margin:0 26px 22px;padding:14px 16px;border-radius:8px;font-size:0.88rem;line-height:1.65;display:none;}
  .feedback.correct-fb{background:var(--green-light);border:1px solid #a8d5bc;color:#145a35;}
  .feedback.wrong-fb{background:var(--red-light);border:1px solid #f0b8b2;color:#922b21;}
  .fb-title{font-weight:700;font-size:0.9rem;margin-bottom:7px;}
  .nav{width:100%;max-width:740px;padding:0 16px;display:flex;justify-content:flex-end;}
  .btn-next{padding:11px 26px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Source Sans 3',Arial,sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;display:none;transition:background 0.15s;}
  .btn-next:hover{background:var(--navy-mid);}
  .score-screen{width:100%;max-width:740px;padding:0 16px;display:none;}
  .score-inner{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:48px 36px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .score-inner h2{font-family:'Source Serif 4',serif;font-size:1.6rem;color:var(--navy);margin-bottom:8px;}
  .score-big{font-size:4rem;font-weight:700;color:var(--gold);margin:20px 0 8px;line-height:1;}
  .score-sub{color:var(--muted);font-size:0.95rem;margin-bottom:28px;}
  .btn-restart{padding:11px 28px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Source Sans 3',Arial,sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;}
  .btn-restart:hover{background:var(--navy-mid);}
  /* scales extras */
  .measure-box{background:var(--navy-light);border-radius:8px;padding:14px 16px;margin-bottom:14px;border-left:3px solid var(--navy);}
  .measure-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:5px;}
  .measure-name{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:4px;}
  .measure-desc{font-size:0.88rem;color:var(--muted);line-height:1.55;}
  .two-step{padding:18px 26px 22px;}
  .step-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:9px;}
  .opt-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px;}
  .opt-row .opt{flex:1;min-width:120px;}
  .divider{height:1px;background:var(--border);margin-bottom:18px;}
  .scale-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;background:var(--navy-light);color:var(--navy);margin-right:5px;margin-top:8px;}
  .what-can{margin-top:8px;font-size:0.84rem;color:#145a35;}
  .what-can strong{font-weight:700;}
  /* construct validity extras */
  .defn-bar{width:100%;max-width:740px;padding:0 16px;margin-bottom:20px;}
  .defn-inner{background:var(--navy-light);border-radius:8px;padding:13px 16px;font-size:0.87rem;color:var(--navy-mid);line-height:1.6;border-left:3px solid var(--navy);}
  .defn-inner strong{color:var(--navy);font-weight:700;}
  .scenario-box{background:var(--navy-light);border-radius:8px;padding:14px 16px;margin-bottom:14px;border-left:3px solid var(--navy);}
  .scenario-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:5px;}
  .scenario-title{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .scenario-text{font-size:0.88rem;color:var(--muted);line-height:1.6;}
  .verdict-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;margin-bottom:8px;}
  .verdict-high{background:var(--green-light);color:var(--green);}
  .verdict-medium{background:#fff8e0;color:#8a6000;}
  .verdict-low{background:var(--red-light);color:var(--red);}
</style>
</head>
<body>
<div class="top-bar">
  <div class="icon">📏</div>
  <div>
    <div class="course-tag">PSYC1106 · Module 2</div>
    <h1>Scales of Measurement</h1>
  </div>
</div>
<div class="progress-wrap">
  <div class="progress-meta"><span id="prog-label">Question 1 of 5</span><span id="prog-score">0 correct</span></div>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
</div>
<div class="card" id="q-card">
  <div class="card-inner">
    <div class="card-header">
      <div class="q-meta"><span class="q-num" id="q-num">Q1</span><span class="q-context" id="q-context"></span></div>
      <div class="measure-box">
        <div class="measure-label">The Measure</div>
        <div class="measure-name" id="m-name"></div>
        <div class="measure-desc" id="m-desc"></div>
      </div>
      <div class="q-ask">What type of scale is this?</div>
    </div>
    <div class="two-step">
      <div class="step-label">Step 1 — Categorical or Continuous?</div>
      <div class="opt-row" id="step1-opts"></div>
      <div class="divider"></div>
      <div class="step-label">Step 2 — Scale Type?</div>
      <div class="opt-row" id="step2-opts"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<div class="nav"><button class="btn-next" id="btn-next" onclick="nextQ()">Next →</button></div>
<div class="score-screen" id="score-screen">
  <div class="score-inner">
    <h2>Practice Complete</h2>
    <div class="score-big" id="score-big"></div>
    <div class="score-sub" id="score-sub"></div>
    <button class="btn-restart" onclick="restart()">Try Again</button>
  </div>
</div>
<script>
const questions=[
  {context:"Clinical psychology",name:"DSM-5 Diagnosis",desc:"A psychologist records a client's primary diagnosis from the DSM-5 (e.g., Major Depressive Disorder, Generalised Anxiety Disorder, PTSD, No diagnosis). Each client gets one category.",catCont:"categorical",scaleType:"nominal",reason:"This is <strong>nominal</strong>. DSM-5 categories are labels — there is no meaningful order between them. MDD is not 'more' than GAD, and you can't calculate an average diagnosis.",canDo:"Count frequencies, compare group sizes.",cannotDo:"Cannot rank, add, subtract, or treat as a number."},
  {context:"Health psychology",name:"PHQ-9 Depression Scale",desc:"The Patient Health Questionnaire-9 asks about 9 depression symptoms, each rated 0–3. Total scores range from 0 to 27. Widely used in Australian GP practices.",catCont:"continuous",scaleType:"interval",reason:"This is <strong>interval</strong>. Equal gaps are assumed between points, but a score of 0 does <em>not</em> mean a complete absence of depression. Ratios aren't meaningful: 20 is not 'twice as depressed' as 10.",canDo:"Calculate means, compare averages, add and subtract.",cannotDo:"Cannot form meaningful ratios (e.g., 'twice as depressed')."},
  {context:"Neuropsychology",name:"Reaction Time (milliseconds)",desc:"In a cognitive assessment, a patient presses a button when a stimulus appears. Their response time is recorded in milliseconds — used to assess processing speed after TBI.",catCont:"continuous",scaleType:"ratio",reason:"This is <strong>ratio</strong>. Milliseconds have a true zero and equal intervals. Ratios are fully meaningful: 400ms is genuinely twice as slow as 200ms.",canDo:"All operations: means, ratios, 'twice as slow' — all valid.",cannotDo:"Nothing — all mathematical operations apply."},
  {context:"Counselling",name:"Symptom Severity Rating",desc:"A counsellor rates a client's current symptom severity as: Minimal / Mild / Moderate / Severe. This is a clinical judgment recorded after each session.",catCont:"categorical",scaleType:"ordinal",reason:"This is <strong>ordinal</strong>. There is a clear order (Minimal &lt; Mild &lt; Moderate &lt; Severe), but gaps are unequal — the difference between Minimal and Mild may not equal the difference between Moderate and Severe.",canDo:"Rank order clients, identify who is worse or better.",cannotDo:"Cannot average, add, or assume equal spacing between categories."},
  {context:"Developmental psychology",name:"Number of Therapy Sessions Attended",desc:"A researcher records how many individual therapy sessions each child has attended in a school-based mental health program across the year. Values: 0, 1, 2, 3…",catCont:"continuous",scaleType:"ratio",reason:"This is <strong>ratio</strong>. Zero sessions is a genuine, meaningful zero (the child attended nothing). Ratios make sense: 8 sessions is exactly twice as many as 4.",canDo:"All operations. Means, ratios, 'twice as many' — all valid.",cannotDo:"Nothing — all mathematical operations are appropriate."}
];
let current=0,score=0,step1done=false,step1correct=false;
function render(){
  const q=questions[current];
  document.getElementById('q-num').textContent=`Q${current+1}`;
  document.getElementById('q-context').textContent=q.context;
  document.getElementById('m-name').textContent=q.name;
  document.getElementById('m-desc').textContent=q.desc;
  document.getElementById('prog').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('prog-label').textContent=`Question ${current+1} of ${questions.length}`;
  document.getElementById('prog-score').textContent=`${score} correct`;
  document.getElementById('step1-opts').innerHTML=['Categorical','Continuous'].map(o=>`<button class="opt" onclick="selectStep1('${o.toLowerCase()}')" id="s1-${o.toLowerCase()}"><span class="opt-letter">${o[0]}</span>${o}</button>`).join('');
  document.getElementById('step2-opts').innerHTML=['Nominal','Ordinal','Interval','Ratio'].map(o=>`<button class="opt" onclick="selectStep2('${o.toLowerCase()}')" id="s2-${o.toLowerCase()}" disabled><span class="opt-letter">${o[0]}</span>${o}</button>`).join('');
  document.getElementById('feedback').style.display='none';
  document.getElementById('btn-next').style.display='none';
  step1done=false;step1correct=false;
}
function selectStep1(val){
  if(step1done)return;step1done=true;
  const q=questions[current];step1correct=val===q.catCont;
  ['categorical','continuous'].forEach(v=>{
    const el=document.getElementById('s1-'+v);el.disabled=true;
    if(v===q.catCont)el.classList.add(val===v?'correct':'missed');
    else if(v===val)el.classList.add('wrong');
  });
  ['nominal','ordinal','interval','ratio'].forEach(v=>{document.getElementById('s2-'+v).disabled=false;});
}
function selectStep2(val){
  const q=questions[current];const ok=val===q.scaleType;const full=step1correct&&ok;if(full)score++;
  ['nominal','ordinal','interval','ratio'].forEach(v=>{
    const el=document.getElementById('s2-'+v);el.disabled=true;
    if(v===q.scaleType)el.classList.add(val===v?'correct':'missed');
    else if(v===val)el.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  fb.className=`feedback ${full?'correct-fb':'wrong-fb'}`;
  fb.innerHTML=`<div class="fb-title">${full?'✓ Correct!':'✗ Not quite — here\'s why:'}</div><div>${q.reason}</div><span class="scale-chip">${q.catCont.charAt(0).toUpperCase()+q.catCont.slice(1)}</span><span class="scale-chip">${q.scaleType.charAt(0).toUpperCase()+q.scaleType.slice(1)}</span><div class="what-can"><strong>Can do:</strong> ${q.canDo}<br><strong>Cannot do:</strong> ${q.cannotDo}</div>`;
  fb.style.display='block';
  const btn=document.getElementById('btn-next');btn.style.display='block';
  btn.textContent=current<questions.length-1?'Next →':'See Results';
  document.getElementById('prog-score').textContent=`${score} correct`;
}
function nextQ(){current++;if(current>=questions.length)showScore();else render();}
function showScore(){
  document.getElementById('q-card').style.display='none';document.querySelector('.nav').style.display='none';
  document.getElementById('prog').style.width='100%';document.getElementById('score-screen').style.display='block';
  document.getElementById('score-big').textContent=`${score}/${questions.length}`;
  document.getElementById('score-sub').textContent=['Keep reviewing — look back at the feedback!','Getting there — review the scale types again.','Decent start — a couple to revisit.','Strong work!','Excellent — all five correct!'][score];
}
function restart(){current=0;score=0;document.getElementById('q-card').style.display='block';document.querySelector('.nav').style.display='flex';document.getElementById('score-screen').style.display='none';render();}
render();
</script>
</body>
</html>
