<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correlational Hypotheses — PSYC1106</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;500;600;700&display=swap');
  :root{--navy:#0d2137;--navy-mid:#163352;--navy-light:#e8edf2;--gold:#E8A000;--gold-light:#fff8e6;--green:#1a7a4a;--green-light:#e6f4ed;--red:#c0392b;--red-light:#fdecea;--text:#1a1a1a;--muted:#5a6a7a;--border:#dde3ea;--bg:#f4f6f8;--surface:#ffffff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Sans 3',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 60px;display:flex;flex-direction:column;align-items:center;}
  .top-bar{width:100%;background:var(--navy);padding:18px 32px;display:flex;align-items:center;gap:14px;margin-bottom:32px;}
  .top-bar .icon{width:38px;height:38px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .top-bar .course-tag{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:2px;}
  .top-bar h1{font-family:'Source Serif 4',serif;font-size:1.3rem;font-weight:600;color:#fff;line-height:1.2;}
  .progress-wrap{width:100%;max-width:760px;padding:0 16px;margin-bottom:20px;}
  .progress-meta{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--muted);margin-bottom:7px;font-weight:600;}
  .progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);border-radius:3px;transition:width 0.5s ease;}
  .main{width:100%;max-width:760px;padding:0 16px;margin-bottom:16px;}
  .card-inner{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .card-header{padding:20px 26px 16px;border-bottom:1px solid var(--border);}
  .q-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .q-num{background:var(--navy);color:#fff;font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;}
  .q-context{font-size:0.72rem;color:var(--muted);font-weight:600;background:var(--navy-light);padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
  .plot-context{font-size:0.88rem;color:var(--text);line-height:1.6;margin-bottom:12px;}
  .plot-area{display:flex;justify-content:center;padding:8px 0 4px;}
  .axis-labels{display:flex;justify-content:center;gap:20px;font-size:0.78rem;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .q-ask{font-size:0.85rem;font-weight:700;color:var(--navy);background:var(--gold-light);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 6px 6px 0;}
  /* Two-step */
  .two-step{padding:18px 26px 22px;}
  .step-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:9px;}
  .opt-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px;}
  .opt-row .opt{flex:1;min-width:100px;}
  .opt{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.15s;color:var(--text);font-family:'Source Sans 3',Arial,sans-serif;font-size:0.88rem;line-height:1.4;text-align:left;}
  .opt:hover:not([disabled]){border-color:var(--navy);background:var(--navy-light);}
  .opt[disabled]{cursor:default;}
  .opt.correct{border-color:var(--green);background:var(--green-light);color:var(--green);}
  .opt.wrong{border-color:var(--red);background:var(--red-light);color:var(--red);opacity:0.8;}
  .opt.missed{border-color:var(--green);background:var(--green-light);color:var(--green);opacity:0.65;}
  .opt-dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;flex-shrink:0;}
  .opt.correct .opt-dot,.opt.missed .opt-dot{background:var(--green);border-color:var(--green);}
  .opt.wrong .opt-dot{background:var(--red);border-color:var(--red);}
  .divider{height:1px;background:var(--border);margin-bottom:18px;}
  .feedback{margin:0 26px 22px;padding:14px 16px;border-radius:8px;font-size:0.88rem;line-height:1.65;display:none;}
  .feedback.correct-fb{background:var(--green-light);border:1px solid #a8d5bc;color:#145a35;}
  .feedback.wrong-fb{background:var(--red-light);border:1px solid #f0b8b2;color:#922b21;}
  .fb-title{font-weight:700;font-size:0.9rem;margin-bottom:7px;}
  .nav{width:100%;max-width:760px;padding:0 16px;display:flex;justify-content:flex-end;}
  .btn-next{padding:11px 26px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Source Sans 3',Arial,sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;display:none;}
  .btn-next:hover{background:var(--navy-mid);}
  .score-screen{width:100%;max-width:760px;padding:0 16px;display:none;}
  .score-inner{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:48px 36px;text-align:center;}
  .score-inner h2{font-family:'Source Serif 4',serif;font-size:1.6rem;color:var(--navy);margin-bottom:8px;}
  .score-big{font-size:4rem;font-weight:700;color:var(--gold);margin:20px 0 8px;line-height:1;}
  .score-sub{color:var(--muted);font-size:0.95rem;margin-bottom:28px;}
  .btn-restart{padding:11px 28px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Source Sans 3',Arial,sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="top-bar">
  <div class="icon">✏️</div>
  <div>
    <div class="course-tag">PSYC1106 · Module 3</div>
    <h1>Correlational Hypotheses</h1>
  </div>
</div>
<div class="progress-wrap">
  <div class="progress-meta"><span id="prog-label">Question 1 of 5</span><span id="prog-score">0 correct</span></div>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
</div>
<div class="main" id="q-card">
  <div class="card-inner">
    <div class="card-header">
      <div class="q-meta"><span class="q-num" id="q-num">Q1</span><span class="q-context" id="q-context"></span></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-ask">Select the correct hypothesis or expected direction of correlation.</div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<div class="nav"><button class="btn-next" id="btn-next" onclick="nextQ()">Next →</button></div>
<div class="score-screen" id="score-screen">
  <div class="score-inner">
    <h2>Practice Complete</h2>
    <div class="score-big" id="score-big"></div>
    <div class="score-sub" id="score-sub"></div>
    <button class="btn-restart" onclick="restart()">Try Again</button>
  </div>
</div>
<script>
const questions=[{"context": "Simple positive case", "text": "Theory: Social support causes lower loneliness. Measures: Social Support Scale score (higher = more support) and UCLA Loneliness Scale score (higher = more loneliness). What is the correct hypothesis?", "options": ["Social Support Scale scores are negatively correlated with UCLA Loneliness Scale scores", "Social Support Scale scores are positively correlated with UCLA Loneliness Scale scores", "Higher social support is associated with less loneliness in adults", "Social support causes reduced loneliness"], "correct": 0, "reason": "More support (higher score) \u2192 less loneliness (lower score). They move in opposite directions \u2014 negative correlation. Options C and D describe constructs, not variables. A correct hypothesis names specific variables and uses 'correlated' with a direction."}, {"context": "Tricky \u2014 direction flip", "text": "Theory: Higher caffeine consumption causes faster mental processing. Measures: cups of coffee per day (higher = more caffeine) and time to complete a cognitive task in seconds (higher = slower). What do we expect?", "options": ["Negative \u2014 more cups of coffee is associated with fewer seconds (faster performance)", "Positive \u2014 more cups of coffee is associated with more seconds on the task", "Positive \u2014 caffeine and processing speed are both increasing together", "Negative \u2014 because caffeine reduces cognitive performance"], "correct": 0, "reason": "More caffeine \u2192 faster processing (construct). Faster processing = fewer seconds on the task = lower score on the time variable. So as coffee cups increase, seconds decrease \u2014 opposite directions \u2014 negative correlation. The key step: translating the construct relationship into the variable relationship."}, {"context": "Tricky \u2014 direction flip", "text": "Theory: Body dissatisfaction causes disordered eating. Measures: Body Dissatisfaction Scale (higher = more dissatisfied) and Eating Disorder Examination Questionnaire (higher = more disordered eating). What correlation is expected?", "options": ["Positive \u2014 higher dissatisfaction scores go with higher disordered eating scores", "Negative \u2014 more dissatisfaction is associated with less disordered eating", "No correlation \u2014 dissatisfaction and eating are unrelated constructs", "Negative \u2014 because the two constructs are opposites"], "correct": 0, "reason": "More dissatisfaction (higher score) \u2192 more disordered eating (higher score). Both variables move in the same direction \u2014 positive correlation. Higher scores on both variables reflect more of each construct, so the translate cleanly from the construct relationship."}, {"context": "Identifying correct format", "text": "Which of the following is a correctly written correlational hypothesis?", "options": ["Mindfulness scores are negatively correlated with perceived stress scores", "Practising mindfulness causes lower stress in university students", "Students who are more mindful tend to feel less stressed", "Higher mindfulness is associated with lower perceived stress"], "correct": 0, "reason": "A correct correlational hypothesis names specific variables (questionnaire scores), uses the word 'correlated', and specifies a direction. Option A does all three. Option B is a causal claim. Options C and D describe constructs rather than observable variable scores."}, {"context": "Applied scenario", "text": "Theory: Experiencing racial discrimination causes lower psychological wellbeing. Measures: Everyday Discrimination Scale (higher = more discrimination) and WEMWBS wellbeing score (higher = better wellbeing). What is the correct hypothesis?", "options": ["Everyday Discrimination Scale scores are negatively correlated with WEMWBS scores", "Everyday Discrimination Scale scores are positively correlated with WEMWBS scores", "Discrimination causes poor psychological wellbeing in minority groups", "WEMWBS scores are positively correlated with discrimination experiences"], "correct": 0, "reason": "More discrimination (higher score) \u2192 lower wellbeing (lower WEMWBS score). They move in opposite directions \u2014 negative correlation. Option B would mean more discrimination is associated with better wellbeing, which is the wrong direction. Option C is a causal claim, not a correctly formatted hypothesis."}];

let current=0,score=0,answered=false;
let shuffledOrders=[];

function shuffleQuestion(q, qi){
  // Deterministic shuffle per question index so it's consistent within a session
  const order=[0,1,2,3].slice(0,q.options.length);
  // Fisher-Yates with seeded values based on question index
  const seed=[3,1,2,0,2,3,1,0,1,2][qi%10];
  for(let i=order.length-1;i>0;i--){
    const j=(i*7+seed+qi*3)%( i+1);
    [order[i],order[j]]=[order[j],order[i]];
  }
  return order;
}

function render(){
  const q=questions[current];
  shuffledOrders[current]=shuffledOrders[current]||shuffleQuestion(q,current);
  const order=shuffledOrders[current];
  document.getElementById('q-num').textContent=`Q${current+1}`;
  document.getElementById('q-context').textContent=q.context;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('prog').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('prog-label').textContent=`Question ${current+1} of ${questions.length}`;
  document.getElementById('prog-score').textContent=`${score} correct`;
  document.getElementById('options').innerHTML=order.map((origIdx,displayPos)=>
    `<button class="opt" onclick="select(${displayPos})" id="opt-${displayPos}"><span class="opt-letter">${'ABCD'[displayPos]}</span><span>${q.options[origIdx]}</span></button>`
  ).join('');
  document.getElementById('feedback').style.display='none';
  document.getElementById('btn-next').style.display='none';
  answered=false;
}

function select(displayPos){
  if(answered)return;answered=true;
  const q=questions[current];
  const order=shuffledOrders[current];
  const correctDisplayPos=order.indexOf(q.correct);
  const ok=displayPos===correctDisplayPos;
  if(ok)score++;
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    el.disabled=true;
    if(idx===correctDisplayPos)el.classList.add(displayPos===idx?'correct':'missed');
    else if(idx===displayPos)el.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  fb.className=`feedback ${ok?'correct-fb':'wrong-fb'}`;
  fb.innerHTML=`<div class="fb-title">${ok?'\u2713 Correct':'\u2717 Not quite'}</div><div>${q.reason}</div>`;
  fb.style.display='block';
  const btn=document.getElementById('btn-next');btn.style.display='block';
  btn.textContent=current<questions.length-1?'Next \u2192':'See Results';
  document.getElementById('prog-score').textContent=`${score} correct`;
}

function nextQ(){current++;if(current>=questions.length)showScore();else render();}
function showScore(){
  document.getElementById('q-card').style.display='none';document.querySelector('.nav').style.display='none';
  document.getElementById('prog').style.width='100%';document.getElementById('score-screen').style.display='block';
  document.getElementById('score-big').textContent=`${score}/${questions.length}`;
  document.getElementById('score-sub').textContent=['Keep reviewing — the construct-to-variable step is key!','Getting there!','Good effort!','Strong work!','Perfect!'][score];
}
function restart(){
  current=0;score=0;shuffledOrders=[];
  document.getElementById('q-card').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('score-screen').style.display='none';
  render();
}
render();

</script>
</body>
</html>
