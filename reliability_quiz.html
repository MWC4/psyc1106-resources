<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reliability in Practice — PSYC1106</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;500;600;700&display=swap');
  :root {
    --navy:#0d2137; --navy-mid:#163352; --navy-light:#e8edf2;
    --gold:#E8A000; --gold-light:#fff8e6;
    --green:#1a7a4a; --green-light:#e6f4ed;
    --red:#c0392b; --red-light:#fdecea;
    --text:#1a1a1a; --muted:#5a6a7a; --border:#dde3ea; --bg:#f4f6f8; --surface:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Sans 3',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 60px;display:flex;flex-direction:column;align-items:center;}
  .top-bar{width:100%;background:var(--navy);padding:18px 32px;display:flex;align-items:center;gap:14px;margin-bottom:32px;}
  .top-bar .icon{width:38px;height:38px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .top-bar .course-tag{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:2px;}
  .top-bar h1{font-family:'Source Serif 4',serif;font-size:1.3rem;font-weight:600;color:#fff;line-height:1.2;}
  .progress-wrap{width:100%;max-width:740px;padding:0 16px;margin-bottom:20px;}
  .progress-meta{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--muted);margin-bottom:7px;font-weight:600;}
  .progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);border-radius:3px;transition:width 0.5s ease;}
  .card{width:100%;max-width:740px;padding:0 16px;margin-bottom:16px;}
  .card-inner{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .card-header{padding:22px 26px 18px;border-bottom:1px solid var(--border);}
  .q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .q-num{background:var(--navy);color:#fff;font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;}
  .q-context{font-size:0.72rem;color:var(--muted);font-weight:600;background:var(--navy-light);padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
  .q-text{font-size:0.97rem;color:var(--text);line-height:1.65;margin-bottom:14px;}
  .q-ask{font-size:0.85rem;font-weight:700;color:var(--navy);background:var(--gold-light);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 6px 6px 0;}
  .options{padding:18px 26px 22px;display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.15s;color:var(--text);font-family:'Source Sans 3',Arial,sans-serif;font-size:0.9rem;line-height:1.45;text-align:left;}
  .opt:hover:not([disabled]){border-color:var(--navy);background:var(--navy-light);}
  .opt[disabled]{cursor:default;}
  .opt.correct{border-color:var(--green);background:var(--green-light);color:var(--green);}
  .opt.wrong{border-color:var(--red);background:var(--red-light);color:var(--red);opacity:0.8;}
  .opt.missed{border-color:var(--green);background:var(--green-light);color:var(--green);opacity:0.65;}
  .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--navy-light);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;margin-top:1px;}
  .opt.correct .opt-letter,.opt.missed .opt-letter{background:var(--green);color:#fff;}
  .opt.wrong .opt-letter{background:var(--red);color:#fff;}
  .feedback{margin:0 26px 22px;padding:14px 16px;border-radius:8px;font-size:0.88rem;line-height:1.65;display:none;}
  .feedback.correct-fb{background:var(--green-light);border:1px solid #a8d5bc;color:#145a35;}
  .feedback.wrong-fb{background:var(--red-light);border:1px solid #f0b8b2;color:#922b21;}
  .fb-title{font-weight:700;font-size:0.9rem;margin-bottom:7px;}
  .fb-tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
  .fb-tag{padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;}
  .tag-tr{background:#d4edda;color:#155724;}
  .tag-ir{background:#cce5ff;color:#004085;}
  .tag-neither{background:var(--navy-light);color:var(--muted);}
  .nav{width:100%;max-width:740px;padding:0 16px;display:flex;justify-content:flex-end;}
  .btn-next{padding:11px 26px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Source Sans 3',Arial,sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;display:none;transition:background 0.15s;}
  .btn-next:hover{background:var(--navy-mid);}
  .score-screen{width:100%;max-width:740px;padding:0 16px;display:none;}
  .score-inner{background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:48px 36px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .score-inner h2{font-family:'Source Serif 4',serif;font-size:1.6rem;color:var(--navy);margin-bottom:8px;}
  .score-big{font-size:4rem;font-weight:700;color:var(--gold);margin:20px 0 8px;line-height:1;}
  .score-sub{color:var(--muted);font-size:0.95rem;margin-bottom:28px;}
  .btn-restart{padding:11px 28px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Source Sans 3',Arial,sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;}
  .btn-restart:hover{background:var(--navy-mid);}
</style>
</head>
<body>
<div class="top-bar">
  <div class="icon">🔁</div>
  <div>
    <div class="course-tag">PSYC1106 · Module 2</div>
    <h1>Reliability in Practice</h1>
  </div>
</div>
<div class="progress-wrap">
  <div class="progress-meta"><span id="prog-label">Question 1 of 5</span><span id="prog-score">0 correct</span></div>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
</div>
<div class="card" id="q-card">
  <div class="card-inner">
    <div class="card-header">
      <div class="q-meta"><span class="q-num" id="q-num">Q1</span><span class="q-context" id="q-context"></span></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-ask">Which type(s) of reliability should be assessed for this measure?</div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>
<div class="nav"><button class="btn-next" id="btn-next" onclick="nextQ()">Next →</button></div>
<div class="score-screen" id="score-screen">
  <div class="score-inner">
    <h2>Practice Complete</h2>
    <div class="score-big" id="score-big"></div>
    <div class="score-sub" id="score-sub"></div>
    <button class="btn-restart" onclick="restart()">Try Again</button>
  </div>
</div>
<script>
const questions=[
  {context:"Clinical psychology",text:"A clinical psychologist uses a standardised behavioural observation checklist to rate how frequently a client displays compulsive hand-washing behaviours during a 50-minute session. Two different clinicians will conduct separate sessions on different days.",options:["Test-retest reliability only","Interrater reliability only","Both test-retest and interrater reliability","Neither — reliability checks are not applicable here"],correct:1,reason:"Hand-washing compulsions are a <strong>state behaviour</strong> — they fluctuate day to day. We'd expect scores to change between sessions, so test-retest doesn't apply. However, because the rating depends on an <strong>external observer's judgment</strong>, two clinicians watching the same session need to agree — interrater matters.",tags:["tag-ir"],tagLabels:["✓ Interrater"]},
  {context:"Organisational psychology",text:"An organisational psychologist is validating a new 30-item self-report questionnaire measuring 'trait emotional resilience' in Australian workplace managers. The scale is designed to measure a stable, enduring characteristic.",options:["Test-retest reliability only","Interrater reliability only","Both test-retest and interrater reliability","Neither — reliability checks are not applicable here"],correct:0,reason:"Trait emotional resilience is a <strong>stable construct</strong> — it shouldn't shift significantly over weeks. Test-retest is essential: the same managers should score similarly 4–6 weeks later. Interrater doesn't apply because it's <strong>self-report</strong> — only the manager can report their own internal experience.",tags:["tag-tr"],tagLabels:["✓ Test-Retest"]},
  {context:"Forensic psychology",text:"Two forensic psychologists independently review the same case file and interview transcript to assess a defendant's long-term risk of violent reoffending using a validated structured professional judgment tool. This risk profile is considered a stable characteristic.",options:["Test-retest reliability only","Interrater reliability only","Both test-retest and interrater reliability","Neither — reliability checks are not applicable here"],correct:2,reason:"This needs <strong>both</strong>. The risk profile is a <strong>stable trait</strong> so test-retest applies. And because the assessment involves <strong>professional judgment applied to external evidence</strong>, two forensic psychologists should reach the same conclusion — interrater applies too.",tags:["tag-tr","tag-ir"],tagLabels:["✓ Test-Retest","✓ Interrater"]},
  {context:"Health psychology",text:"Before and after a mindfulness intervention, participants are asked: 'On a scale from 1 to 10, how stressed do you feel right now?' Scores are recorded immediately before and immediately after a 20-minute session.",options:["Test-retest reliability only","Interrater reliability only","Both test-retest and interrater reliability","Neither — reliability checks are not applicable here"],correct:3,reason:"Neither applies. Momentary stress is a <strong>state</strong> — we want it to change across the session. And because it's <strong>self-report</strong> of an internal experience, no external rater can access it. This doesn't mean the measure is bad — these checks just don't apply here.",tags:["tag-neither"],tagLabels:["✗ Neither applies"]},
  {context:"Neuropsychology",text:"A neuropsychologist administers the Rey Auditory Verbal Learning Test (RAVLT) to assess a patient's verbal learning and memory ability following a traumatic brain injury. Memory capacity post-TBI is treated as a stable deficit profile unlikely to change over a short period.",options:["Test-retest reliability only","Interrater reliability only","Both test-retest and interrater reliability","Neither — reliability checks are not applicable here"],correct:0,reason:"Memory capacity post-TBI is a <strong>stable trait</strong>, so test-retest is relevant. Interrater doesn't apply because the RAVLT produces <strong>objective scores</strong> (words recalled correctly) — there's no subjective rater judgment involved.",tags:["tag-tr"],tagLabels:["✓ Test-Retest"]}
];
let current=0,score=0,answered=false;
function render(){
  const q=questions[current];
  document.getElementById('q-num').textContent=`Q${current+1}`;
  document.getElementById('q-context').textContent=q.context;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('prog').style.width=`${(current/questions.length)*100}%`;
  document.getElementById('prog-label').textContent=`Question ${current+1} of ${questions.length}`;
  document.getElementById('prog-score').textContent=`${score} correct`;
  document.getElementById('options').innerHTML=q.options.map((o,i)=>`<button class="opt" onclick="select(${i})" id="opt-${i}"><span class="opt-letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('');
  document.getElementById('feedback').style.display='none';
  document.getElementById('btn-next').style.display='none';
  answered=false;
}
function select(i){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const ok=i===q.correct;
  if(ok)score++;
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    el.disabled=true;
    if(idx===q.correct)el.classList.add(i===idx?'correct':'missed');
    else if(idx===i)el.classList.add('wrong');
  });
  const fb=document.getElementById('feedback');
  const tags=q.tags.map((t,ti)=>`<span class="fb-tag ${t}">${q.tagLabels[ti]}</span>`).join('');
  fb.className=`feedback ${ok?'correct-fb':'wrong-fb'}`;
  fb.innerHTML=`<div class="fb-title">${ok?'✓ Correct':'✗ Not quite'}</div><div>${q.reason}</div><div class="fb-tag-row">${tags}</div>`;
  fb.style.display='block';
  const btn=document.getElementById('btn-next');
  btn.style.display='block';
  btn.textContent=current<questions.length-1?'Next →':'See Results';
  document.getElementById('prog-score').textContent=`${score} correct`;
}
function nextQ(){current++;if(current>=questions.length)showScore();else render();}
function showScore(){
  document.getElementById('q-card').style.display='none';
  document.querySelector('.nav').style.display='none';
  document.getElementById('prog').style.width='100%';
  document.getElementById('score-screen').style.display='block';
  document.getElementById('score-big').textContent=`${score}/${questions.length}`;
  document.getElementById('score-sub').textContent=['Keep reviewing the concepts!','Good effort — review the feedback above.','Solid understanding!','Great work!','Perfect score!'][score];
}
function restart(){
  current=0;score=0;
  document.getElementById('q-card').style.display='block';
  document.querySelector('.nav').style.display='flex';
  document.getElementById('score-screen').style.display='none';
  render();
}
render();
</script>
</body>
</html>
