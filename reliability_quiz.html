<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reliability Quiz — PSYC1106</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --text: #e8eaf2;
    --muted: #7b82a3;
    --gold: #E8A000;
    --gold-dim: rgba(232,160,0,0.15);
    --green: #2ecc87;
    --green-dim: rgba(46,204,135,0.12);
    --red: #e8526a;
    --red-dim: rgba(232,82,106,0.12);
    --blue: #5b8dee;
    --blue-dim: rgba(91,141,238,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
    max-width: 640px;
  }

  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.2;
  }

  .header p { font-size: 0.95rem; color: var(--muted); line-height: 1.6; }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
    width: 100%;
    max-width: 720px;
  }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .progress-label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }

  /* Card */
  .card {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 20px;
  }

  .card-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border);
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .q-num {
    background: var(--gold-dim);
    color: var(--gold);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  .q-context {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 500;
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .q-text {
    font-size: 1.05rem;
    color: var(--text);
    line-height: 1.65;
  }

  .q-ask {
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--gold);
    font-weight: 600;
  }

  /* Options */
  .options {
    padding: 20px 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.18s;
    text-align: left;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    line-height: 1.4;
  }

  .opt:hover:not([disabled]) {
    border-color: var(--gold);
    background: var(--gold-dim);
  }

  .opt[disabled] { cursor: default; }

  .opt.correct {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
  }

  .opt.wrong {
    border-color: var(--red);
    background: var(--red-dim);
    color: var(--red);
    opacity: 0.7;
  }

  .opt.missed {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
    opacity: 0.6;
  }

  .opt-letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    transition: background 0.18s;
  }

  .opt.correct .opt-letter { background: var(--green); color: #000; }
  .opt.wrong   .opt-letter { background: var(--red);   color: #fff; }
  .opt.missed  .opt-letter { background: var(--green); color: #000; }

  /* Feedback */
  .feedback {
    margin: 0 28px 24px;
    padding: 16px 18px;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.6;
    display: none;
  }

  .feedback.correct-fb { background: var(--green-dim); border: 1px solid var(--green); color: #a8f5d3; }
  .feedback.wrong-fb   { background: var(--red-dim);   border: 1px solid var(--red);   color: #f5b8c2; }

  .feedback .fb-title {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .fb-key-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .fb-tag {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .tag-tr  { background: rgba(46,204,135,0.2); color: var(--green); }
  .tag-ir  { background: rgba(91,141,238,0.2); color: var(--blue); }
  .tag-neither { background: rgba(123,130,163,0.2); color: var(--muted); }

  /* Nav */
  .nav {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: flex-end;
  }

  .btn-next {
    padding: 12px 28px;
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    display: none;
    transition: opacity 0.2s;
  }

  .btn-next:hover { opacity: 0.88; }

  /* Score screen */
  .score-screen {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 48px 36px;
    text-align: center;
    display: none;
  }

  .score-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .score-big {
    font-size: 4rem;
    font-weight: 700;
    color: var(--gold);
    margin: 20px 0;
    line-height: 1;
  }

  .score-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }

  .btn-restart {
    padding: 12px 32px;
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Reliability in Practice</h1>
  <p>For each measure, identify which type(s) of reliability are relevant to assess.</p>
</div>

<div class="progress-row">
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div class="progress-label" id="prog-label">Question 1 of 5</div>
</div>

<div class="card" id="q-card">
  <div class="card-header">
    <div class="q-meta">
      <span class="q-num" id="q-num">Q1</span>
      <span class="q-context" id="q-context"></span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="q-ask">Which type(s) of reliability should be assessed for this measure?</div>
  </div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="nav">
  <button class="btn-next" id="btn-next" onclick="nextQ()">Next →</button>
</div>

<div class="score-screen" id="score-screen">
  <h2>Session Complete</h2>
  <div class="score-big" id="score-big"></div>
  <div class="score-sub" id="score-sub"></div>
  <button class="btn-restart" onclick="restart()">Try Again</button>
</div>

<script>
const questions = [
  {
    context: "Clinical psychology",
    text: "A clinical psychologist uses a standardised behavioural observation checklist to rate how frequently a client displays compulsive hand-washing behaviours during a 50-minute session. Two different clinicians will conduct separate sessions on different days.",
    options: [
      "Test-retest reliability only",
      "Interrater reliability only",
      "Both test-retest and interrater reliability",
      "Neither — reliability checks are not applicable here"
    ],
    correct: 1,
    reason: "Hand-washing compulsions are a <strong>state behaviour</strong> — they fluctuate day to day based on anxiety, context, and treatment progress. We'd expect (and want) scores to change between sessions. So test-retest doesn't apply. However, because the rating depends on an <strong>external observer's judgment</strong>, two different clinicians watching the same session need to agree — interrater reliability matters.",
    tags: ["tag-ir"],
    tagLabels: ["✓ Interrater"]
  },
  {
    context: "Organisational psychology",
    text: "An organisational psychologist is validating a new 30-item self-report questionnaire measuring 'trait emotional resilience' in Australian workplace managers. The scale is designed to measure a stable, enduring characteristic.",
    options: [
      "Test-retest reliability only",
      "Interrater reliability only",
      "Both test-retest and interrater reliability",
      "Neither — reliability checks are not applicable here"
    ],
    correct: 0,
    reason: "Trait emotional resilience is a <strong>stable construct</strong> — it shouldn't shift significantly over weeks. So test-retest reliability is essential: give the same managers the questionnaire again 4–6 weeks later and scores should be similar. Interrater doesn't apply because it's <strong>self-report</strong> — only the manager can report their own internal experience, there's no second rater.",
    tags: ["tag-tr"],
    tagLabels: ["✓ Test-Retest"]
  },
  {
    context: "Forensic psychology",
    text: "Two forensic psychologists independently review the same case file and interview transcript to assess a defendant's long-term risk of violent reoffending using a validated structured professional judgment tool (e.g., HCR-20). This risk profile is considered a stable characteristic.",
    options: [
      "Test-retest reliability only",
      "Interrater reliability only",
      "Both test-retest and interrater reliability",
      "Neither — reliability checks are not applicable here"
    ],
    correct: 2,
    reason: "This needs <strong>both</strong>. The risk profile is a <strong>stable trait</strong> — a person's underlying risk factors don't change dramatically week to week — so the same assessment done at two different times should produce similar scores (test-retest). And because the assessment involves <strong>professional judgment applied to the same external evidence</strong> (case file, interview), two different forensic psychologists should reach the same conclusion (interrater).",
    tags: ["tag-tr", "tag-ir"],
    tagLabels: ["✓ Test-Retest", "✓ Interrater"]
  },
  {
    context: "Health psychology",
    text: "Before and after a mindfulness intervention, participants are asked: 'On a scale from 1 to 10, how stressed do you feel right now?' Scores are recorded immediately before and immediately after a 20-minute session.",
    options: [
      "Test-retest reliability only",
      "Interrater reliability only",
      "Both test-retest and interrater reliability",
      "Neither — reliability checks are not applicable here"
    ],
    correct: 3,
    reason: "Neither applies here. Momentary stress is a <strong>state</strong> — we explicitly want it to change across the session (that's the whole point of the intervention). So test-retest is not only inapplicable, it's the wrong thing to want. And because it's <strong>self-report</strong> of an internal experience, no external rater can access it — there's no second rater to agree with the first. This doesn't mean the measure is bad, it just means these particular quality checks don't apply.",
    tags: ["tag-neither"],
    tagLabels: ["✗ Neither applies"]
  },
  {
    context: "Neuropsychology",
    text: "A neuropsychologist administers the Rey Auditory Verbal Learning Test (RAVLT) to assess a patient's verbal learning and memory ability following a traumatic brain injury. Memory capacity following TBI is treated as a relatively stable deficit profile that is unlikely to change over a short period.",
    options: [
      "Test-retest reliability only",
      "Interrater reliability only",
      "Both test-retest and interrater reliability",
      "Neither — reliability checks are not applicable here"
    ],
    correct: 0,
    reason: "Memory capacity post-TBI is a <strong>stable trait</strong> — the underlying deficit profile doesn't fluctuate significantly in the short term. So test-retest is relevant: the same patient should score similarly if retested weeks later (assuming no recovery). Interrater doesn't apply because the RAVLT produces <strong>objective scores</strong> (words recalled correctly) — there's no subjective rater judgment involved. Any scorer applying the rules would reach the same result.",
    tags: ["tag-tr"],
    tagLabels: ["✓ Test-Retest"]
  }
];

let current = 0, score = 0, answered = false;

function render() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `Q${current + 1}`;
  document.getElementById('q-context').textContent = q.context;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog').style.width = `${(current / questions.length) * 100}%`;
  document.getElementById('prog-label').textContent = `Question ${current + 1} of ${questions.length}`;

  const opts = document.getElementById('options');
  opts.innerHTML = q.options.map((o, i) => `
    <button class="opt" onclick="select(${i})" id="opt-${i}">
      <span class="opt-letter">${'ABCD'[i]}</span>
      <span>${o}</span>
    </button>
  `).join('');

  document.getElementById('feedback').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  answered = false;
}

function select(i) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const isCorrect = i === q.correct;
  if (isCorrect) score++;

  // Style options
  document.querySelectorAll('.opt').forEach((el, idx) => {
    el.disabled = true;
    if (idx === q.correct) el.classList.add(i === idx ? 'correct' : 'missed');
    else if (idx === i)     el.classList.add('wrong');
  });

  // Feedback
  const fb = document.getElementById('feedback');
  const tagsHtml = q.tags.map((t, ti) => `<span class="fb-tag ${t}">${q.tagLabels[ti]}</span>`).join('');
  fb.className = `feedback ${isCorrect ? 'correct-fb' : 'wrong-fb'}`;
  fb.innerHTML = `
    <div class="fb-title">${isCorrect ? '✓ Correct' : '✗ Not quite'}</div>
    <div>${q.reason}</div>
    <div class="fb-key-row">${tagsHtml}</div>
  `;
  fb.style.display = 'block';

  // Next button
  const btn = document.getElementById('btn-next');
  btn.style.display = 'block';
  btn.textContent = current < questions.length - 1 ? 'Next →' : 'See Results';
}

function nextQ() {
  current++;
  if (current >= questions.length) {
    showScore();
  } else {
    render();
  }
}

function showScore() {
  document.getElementById('q-card').style.display = 'none';
  document.querySelector('.nav').style.display = 'none';
  const ss = document.getElementById('score-screen');
  ss.style.display = 'block';
  document.getElementById('score-big').textContent = `${score}/${questions.length}`;
  const msgs = ['Keep reviewing the concepts!', 'Good effort — review the feedback above.', 'Solid understanding!', 'Great work!', 'Perfect score!'];
  document.getElementById('score-sub').textContent = msgs[score];
}

function restart() {
  current = 0; score = 0;
  document.getElementById('q-card').style.display = 'block';
  document.querySelector('.nav').style.display = 'flex';
  document.getElementById('score-screen').style.display = 'none';
  render();
}

render();
</script>
</body>
</html>
